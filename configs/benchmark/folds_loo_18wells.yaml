# Leave-one-well-out fold structure of the revised benchmark (R1): 18 wells, 18 folds.
#
# DOCUMENTATION, NOT A CONTROL FILE. The harness never reads this file; it derives the
# folds from `folds_loo.json` written by scripts/build_dataset.py for whatever corpus
# it was pointed at. This file makes the 18-fold protocol of the revised article legible
# without the proprietary corpus.
#
# The wells are the anonymised identifiers W01-W18 of the revised article, listed in the
# order of `folds_loo.json`: well W{fold+1:02d} is the well held out in fold `fold`. This
# is the same numbering as the `well` column of results/revision_r1/error_stats/
# (published with BRGM approval). It is NOT the W01-W19 numbering of the original
# submission (configs/benchmark/folds_loo_19wells.yaml, kept as legacy), and no
# correspondence between the two numberings is published.
# The well excluded by the depth-step QC has no W-identifier.

n_wells: 18
n_folds: 18
cross_validation: leave-one-well-out

wells: [W01, W02, W03, W04, W05, W06, W07, W08, W09, W10, W11, W12, W13, W14, W15, W16, W17, W18]

folds:
